<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Micro:bit 藍芽 UART LED 控制端</title>
    <style>
        body { font-family: '微軟正黑體', sans-serif; background: #222; color: #eee; text-align: center; padding-top: 50px; }
        .grid { display: inline-grid; grid-template-columns: repeat(5, 50px); gap: 5px; margin: 20px auto; }
        .cell { width: 50px; height: 50px; background: #444; border: 2px solid #555; border-radius: 5px; cursor: pointer; transition: 0.1s; }
        .cell.on { background: #ff3333; border-color: #ffaaaa; box-shadow: 0 0 10px red; }
        button { padding: 10px 20px; font-size: 16px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #45a049; }
        button:disabled { background: #888; cursor: not-allowed; }
        .hint { color: #888; font-size: 14px; margin-top: 20px; line-height: 1.6; }
        .controls { margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        input[type="text"] { padding: 8px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; width: 120px; background: #333; color: white; }
    </style>
</head>
<body>
    <h1>Micro:bit 藍芽 UART 無人機燈號</h1>
    <p id="status" style="font-size: 1.2em; color: #aaa;">尚未連接 (請使用 Chrome 或 Edge 瀏覽器)</p>
    
    <div class="controls">
        <label>密碼 (若無則免填):</label>
        <input type="text" id="pwdInput" placeholder="輸入密碼">
        <button id="connectBtn">連接 Micro:bit</button>
        <button id="resendPwdBtn" style="display:none; background:#ff9800;">手動發送密碼</button>
    </div>

    <div class="grid" id="ledGrid"></div>

    <div class="hint">
        <p>※ <b>Micro:bit 燒錄提示：</b></p>
        <p>1. 請在 MakeCode 匯入擴充：<code>https://github.com/pandapanda6666/pxt-microbit-ble</code></p>
        <p>2. 確保積木有放 <b>啟動藍芽 UART 矩陣接收器</b> 於「當啟動時」。</p>
        <p>3. 專案設定必須為 <b>No Pairing Required</b>。</p>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; 

        let txChar = null;
        let isBusy = false;
        const matrix = Array.from({length: 5}, () => Array(5).fill(false));

        const grid = document.getElementById("ledGrid");
        for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 5; c++) {
                let div = document.createElement("div");
                div.className = "cell";
                div.onclick = () => {
                    matrix[r][c] = !matrix[r][c];
                    div.classList.toggle("on", matrix[r][c]);
                    sendMatrix();
                };
                grid.appendChild(div);
            }
        }

        document.getElementById("resendPwdBtn").onclick = async () => {
            if (!txChar) return;
            let pwd = document.getElementById("pwdInput").value.trim();
            if (pwd !== "") {
                document.getElementById("status").innerText = "發送密碼認證中...";
                let encoder = new TextEncoder();
                let pwdData = encoder.encode("PWD:" + pwd + "\n");
                await txChar.writeValueWithoutResponse(pwdData);
                document.getElementById("status").innerText = "密碼已手動發送！請看板子是否有亮 ✔️ 或 ❌";
                document.getElementById("status").style.color = "#4CAF50";
            } else {
                document.getElementById("status").innerText = "請先輸入密碼再點擊送出！";
                document.getElementById("status").style.color = "red";
            }
        };

        document.getElementById("connectBtn").onclick = async () => {
            try {
                document.getElementById("status").innerText = "請求藍芽裝置中... 請在彈出視窗選擇裝置";
                document.getElementById("status").style.color = "#00aaff";
                
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });
                
                device.addEventListener('gattserverdisconnected', () => {
                    document.getElementById("status").innerText = "連線已斷開！";
                    document.getElementById("status").style.color = "red";
                    document.getElementById("connectBtn").disabled = false;
                    document.getElementById("resendPwdBtn").style.display = "none";
                    txChar = null;
                });

                document.getElementById("status").innerText = "連接中... (請耐心等待)";
                document.getElementById("connectBtn").disabled = true;
                
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                txChar = await service.getCharacteristic(CHAR_UUID_RX);
                
                // 等待長一點 (1秒)，確保 Micro:bit 藍芽 UART 服務完全就緒，避免第一個封包被吃掉
                await new Promise(r => setTimeout(r, 1000));
                
                let pwd = document.getElementById("pwdInput").value.trim();
                if (pwd !== "") {
                    document.getElementById("status").innerText = "自動發送密碼認證中...";
                    let encoder = new TextEncoder();
                    let pwdData = encoder.encode("PWD:" + pwd + "\n");
                    await txChar.writeValueWithoutResponse(pwdData);
                    await new Promise(r => setTimeout(r, 100));
                }
                
                document.getElementById("status").innerText = "連線成功！請看板子是否有亮 ✔️，並點擊下方格子發送訊號。";
                document.getElementById("status").style.color = "#4CAF50";
                document.getElementById("connectBtn").style.display = "none";
                document.getElementById("resendPwdBtn").style.display = "inline-block";
                
                sendMatrix();
            } catch (err) {
                document.getElementById("connectBtn").disabled = false;
                if (err.name === "NotFoundError") {
                    document.getElementById("status").innerText = "已取消連線 (未選擇裝置)";
                    document.getElementById("status").style.color = "#aaa";
                } else {
                    document.getElementById("status").innerText = "連線失敗: " + err;
                    document.getElementById("status").style.color = "red";
                }
            }
        };

        async function sendMatrix() {
            if (!txChar || isBusy) return;
            isBusy = true;
            
            let nums = [];
            for (let r = 0; r < 5; r++) {
                let val = 0;
                for (let c = 0; c < 5; c++) {
                    if (matrix[r][c]) val |= (1 << c);
                }
                nums.push(val);
            }
            let str = nums.join(",") + "\n";

            let encoder = new TextEncoder();
            let data = encoder.encode(str);

            try {
                await txChar.writeValueWithoutResponse(data);
            } catch (e) {
                console.error("發送失敗:", e);
                document.getElementById("status").innerText = "發送失敗: " + e.message;
                document.getElementById("status").style.color = "red";
            }
            isBusy = false;
        }
    </script>
</body>
</html>
