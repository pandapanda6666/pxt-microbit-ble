<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Micro:bit 藍芽 UART LED 控制器 (網頁版)</title>
    <style>
        body { font-family: '微軟正黑體', sans-serif; background: #222; color: #eee; text-align: center; padding-top: 50px; }
        .grid { display: inline-grid; grid-template-columns: repeat(5, 50px); gap: 5px; margin: 20px auto; }
        .cell { width: 50px; height: 50px; background: #444; border: 2px solid #555; border-radius: 5px; cursor: pointer; transition: 0.1s; }
        .cell.on { background: #ff3333; border-color: #ffaaaa; box-shadow: 0 0 10px red; }
        button { padding: 10px 20px; font-size: 16px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #45a049; }
        .hint { color: #888; font-size: 14px; margin-top: 20px; line-height: 1.6; }
    </style>
</head>
<body>
    <h1>Micro:bit 藍芽 UART 傳送端</h1>
    <p id="status" style="font-size: 1.2em; color: #aaa;">尚未連線 (請使用 Chrome 或 Edge 瀏覽器)</p>
    密碼 (若有設定): <input type="text" id="pwdInput" style="font-size:16px; padding:5px; margin-right:10px; width: 100px;"><button id="connectBtn">連接 Micro:bit</button>

    <br>
    <div class="grid" id="ledGrid"></div>

    <div class="hint">
        <p>💡 <b>Micro:bit 準備事項：</b></p>
        <p>1. 請在 MakeCode 匯入擴充：<code>https://github.com/pandapanda6666/pxt-microbit-ble</code></p>
        <p>2. 拉出 <b>啟動藍芽 UART 矩陣接收器</b> 積木到「當啟動時」。</p>
        <p>3. 專案設定將藍芽連線模式設為「<b>No Pairing Required</b>」。</p>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; 

        let txChar = null;
        let isBusy = false;
        const matrix = Array.from({length: 5}, () => Array(5).fill(false));

        const grid = document.getElementById("ledGrid");
        for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 5; c++) {
                let div = document.createElement("div");
                div.className = "cell";
                div.onclick = () => {
                    matrix[r][c] = !matrix[r][c];
                    div.classList.toggle("on", matrix[r][c]);
                    
                // Send password
                let pwd = document.getElementById("pwdInput").value;
                let encoder = new TextEncoder();
                let pwdData = encoder.encode("PWD:" + pwd + "\n");
                for (let i = 0; i < pwdData.length; i += 15) {
                    await txChar.writeValueWithoutResponse(pwdData.slice(i, i + 15));
                    await new Promise(r => setTimeout(r, 50));
                }
                await new Promise(r => setTimeout(r, 100));
                
                sendMatrix();
                };
                grid.appendChild(div);
            }
        }

        document.getElementById("connectBtn").onclick = async () => {
            try {
                document.getElementById("status").innerText = "請求藍芽裝置中... 請在彈出視窗選擇裝置";
                document.getElementById("status").style.color = "#00aaff";
                
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });
                
                device.addEventListener('gattserverdisconnected', () => {
                    document.getElementById("status").innerText = "連線已斷開！";
                    document.getElementById("status").style.color = "red";
                    document.getElementById("connectBtn").style.display = "inline-block";
                    txChar = null;
                });

                document.getElementById("status").innerText = "連接中... (請耐心等待)";
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                txChar = await service.getCharacteristic(CHAR_UUID_RX);
                
                // 等待一下讓藍芽底層穩定，避免剛連上馬上發送導致 Operation failed
                await new Promise(r => setTimeout(r, 500));
                
                document.getElementById("status").innerText = "連線成功！點擊下方格子發送訊號。";
                document.getElementById("status").style.color = "#4CAF50";
                document.getElementById("connectBtn").style.display = "none";
                
                sendMatrix();
            } catch (err) {
                if (err.name === "NotFoundError") {
                    document.getElementById("status").innerText = "已取消連線 (未選擇裝置)";
                    document.getElementById("status").style.color = "#aaa";
                } else {
                    document.getElementById("status").innerText = "連線失敗: " + err;
                    document.getElementById("status").style.color = "red";
                }
            }
        };

        async function sendMatrix() {
            if (!txChar || isBusy) return;
            isBusy = true;
            
            let str = "";
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    str += matrix[r][c] ? "1" : "0";
                }
            }
            str += "\n";

            let encoder = new TextEncoder();
            let data = encoder.encode(str);

            try {
                // 強制拆包發送 (每包 15 bytes)，避免 20 bytes 的 MTU 限制
                for (let i = 0; i < data.length; i += 15) {
                    let chunk = data.slice(i, i + 15);
                    await txChar.writeValueWithoutResponse(chunk);
                    // 每次寫入後稍微等待，避免塞爆藍芽緩衝區導致 operation failed
                    await new Promise(r => setTimeout(r, 50));
                }
            } catch (e) {
                console.error("發送失敗:", e);
                document.getElementById("status").innerText = "發送失敗: " + e.message;
                document.getElementById("status").style.color = "red";
            }
            isBusy = false;
        }
    </script>
</body>
</html>
